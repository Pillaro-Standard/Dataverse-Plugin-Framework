name: 'Spike: GitHub-hosted Windows runner capability'

# Diagnostic only. Builds nothing that is kept, publishes nothing, deploys nothing.
#
# Answers the go/no-go question for moving CI off Azure DevOps: can a GitHub-hosted
# windows runner do the three things the Azure DevOps agents currently do that a plain
# `dotnet build` cannot?
#
#   1. Build the VSIX          — needs the Visual Studio SDK (VSSDK) build tools
#   2. Build examples/*.Logic  — legacy non-SDK project, needs full MSBuild with restore
#   3. Pack the nuspec files   — needs nuget.exe, not `dotnet pack`
#
# Every probe is tolerant: the run collects results and reports them in the job summary
# instead of stopping at the first gap, so one dispatch answers the whole question.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe windows-latest
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Record runner identity
        shell: pwsh
        run: |
          "results.txt" | ForEach-Object { if (Test-Path $_) { Remove-Item $_ } }

          "## Runner"                                              | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ""                                                       | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Image: ``$env:ImageOS`` / ``$env:ImageVersion``"       | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- OS: ``$([System.Environment]::OSVersion.VersionString)``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- dotnet: ``$(dotnet --version)``"                       | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ""                                                       | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Probe the toolchain
        id: toolchain
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          function Add-Result {
            param([string]$Name, [bool]$Ok, [string]$Detail)
            $status = if ($Ok) { 'yes' } else { 'NO' }
            Add-Content -Path 'results.txt' -Value "$Name|$status|$Detail" -Encoding utf8
            Write-Host "$Name : $status  $Detail"
          }

          # --- Visual Studio -------------------------------------------------------
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            Add-Result 'vswhere present' $false 'Installer\vswhere.exe not found'
            $vsRoot = $null
          }
          else {
            $vsRoot = & $vswhere -latest -products '*' -property installationPath
            Add-Result 'Visual Studio install' ([bool]$vsRoot) "$vsRoot"

            $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' |
              Select-Object -First 1
            Add-Result 'VS MSBuild' ([bool]$msbuild) "$msbuild"

            if ($msbuild) {
              "msbuild=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            }

            $workloads = & $vswhere -latest -property 'packages' 2>$null
            $hasVssdkWorkload = $false

            if ($workloads) {
              $hasVssdkWorkload = ($workloads -join ' ') -match 'VisualStudioExtension'
            }

            Add-Result 'VSSDK workload reported by vswhere' $hasVssdkWorkload ''
          }

          # --- The file that actually matters for the VSIX build --------------------
          # Pillaro.Dataverse.PluginTemplate.VisualStudio.Vsix.csproj imports
          # $(VSToolsPath)\VSSDK\Microsoft.VsSDK.targets. Without it the project cannot
          # even be evaluated, which is how it fails locally.
          $vssdkTargets = @()

          if ($vsRoot) {
            $vssdkTargets = @(Get-ChildItem -Path $vsRoot -Recurse -Filter 'Microsoft.VsSDK.targets' `
              -ErrorAction SilentlyContinue | Select-Object -First 3)
          }

          Add-Result 'Microsoft.VsSDK.targets' ($vssdkTargets.Count -gt 0) `
            (($vssdkTargets | ForEach-Object { $_.FullName }) -join '; ')

          # The targets file can be present while $(VSToolsPath) still resolves to the
          # x86 fallback that does not contain it, which is what MSB4226 reports. Export
          # the directory two levels above the targets file so the build can be pointed
          # at the real one.
          if ($vssdkTargets.Count -gt 0) {
            $vsToolsPath = Split-Path -Parent (Split-Path -Parent $vssdkTargets[0].FullName)
            Add-Result 'Derived VSToolsPath' $true $vsToolsPath
            "vstoolspath=$vsToolsPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

          # --- VsixPublisher, used by the Marketplace deploy today -----------------
          $publisher = @()

          if ($vsRoot) {
            $publisher = @(Get-ChildItem -Path $vsRoot -Recurse -Filter 'VsixPublisher.exe' `
              -ErrorAction SilentlyContinue | Select-Object -First 1)
          }

          Add-Result 'VsixPublisher.exe' ($publisher.Count -gt 0) `
            (($publisher | ForEach-Object { $_.FullName }) -join '')

          # --- .NET Framework 4.6.2 targeting pack ---------------------------------
          $refAsm = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.6.2"
          Add-Result '.NET Framework 4.6.2 targeting pack' (Test-Path $refAsm) $refAsm

          # --- nuget.exe, needed for the nuspec-based packs -------------------------
          $nuget = Get-Command nuget -ErrorAction SilentlyContinue
          Add-Result 'nuget.exe on PATH' ([bool]$nuget) "$($nuget.Source)"

      - name: Build the framework with the .NET SDK (baseline)
        id: build-framework
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build src/Pillaro.Dataverse.PluginFramework/Pillaro.Dataverse.PluginFramework.csproj `
            -c Release

      - name: Build the VSIX with VS MSBuild
        id: build-vsix
        continue-on-error: true
        shell: pwsh
        run: |
          $msbuild = '${{ steps.toolchain.outputs.msbuild }}'

          if (-not $msbuild) {
            throw 'VS MSBuild was not found, so the VSIX cannot be built.'
          }

          & $msbuild 'templates\Pillaro.Dataverse.PluginTemplate.VisualStudio.Vsix\Pillaro.Dataverse.PluginTemplate.VisualStudio.Vsix.csproj' `
            -t:Restore,Build `
            -p:Configuration=Release `
            -p:ArtifactsDirectory=artifacts/spike `
            -p:VSToolsPath='${{ steps.toolchain.outputs.vstoolspath }}' `
            -v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild exited with $LASTEXITCODE."
          }

          $vsix = Get-ChildItem -Path 'artifacts/spike' -Filter '*.vsix' -ErrorAction SilentlyContinue

          if (-not $vsix) {
            throw 'MSBuild succeeded but no .vsix was produced.'
          }

          Write-Host "Produced $($vsix.Name), $([math]::Round($vsix.Length / 1KB)) KB"

      - name: Build the legacy examples project with VS MSBuild
        id: build-examples
        continue-on-error: true
        shell: pwsh
        run: |
          $msbuild = '${{ steps.toolchain.outputs.msbuild }}'

          if (-not $msbuild) {
            throw 'VS MSBuild was not found, so the legacy examples project cannot be built.'
          }

          # Legacy non-SDK project that still uses PackageReference, so restore has to
          # run through MSBuild rather than `dotnet restore`.
          & $msbuild 'examples\Pillaro.Dataverse.PluginFramework.Examples.Logic\Pillaro.Dataverse.PluginFramework.Examples.Logic.csproj' `
            -t:Restore,Build `
            -p:Configuration=Release `
            -v:minimal

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild exited with $LASTEXITCODE."
          }

      - name: Publish the CLI, which the framework nuspec includes
        id: publish-cli
        continue-on-error: true
        shell: pwsh
        run: |
          # The nuspec packs tools/...Cli/bin/Release/net8.0/publish/**, so the pack
          # cannot succeed without this. The Azure DevOps pipeline has the same step.
          dotnet publish tools/Pillaro.Dataverse.PluginFramework.Cli/Pillaro.Dataverse.PluginFramework.Cli.csproj `
            -c Release -f net8.0 --no-self-contained `
            -o tools/Pillaro.Dataverse.PluginFramework.Cli/bin/Release/net8.0/publish

      - name: Pack the framework nuspec with nuget.exe
        id: pack-nuspec
        continue-on-error: true
        shell: pwsh
        run: |
          nuget pack 'src/Pillaro.Dataverse.PluginFramework/Tools/PluginPackaging/Pillaro.Dataverse.PluginFramework.nuspec' `
            -BasePath 'src/Pillaro.Dataverse.PluginFramework' `
            -Properties 'configuration=Release;version=0.0.0-spike' `
            -OutputDirectory 'artifacts/spike-nupkg' `
            -NonInteractive

          if ($LASTEXITCODE -ne 0) {
            throw "nuget pack exited with $LASTEXITCODE."
          }

      - name: Upload what was produced, so it can be inspected
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: spike-output
          path: |
            artifacts/spike/*.vsix
            artifacts/spike/*.zip
            artifacts/spike-nupkg/*.nupkg
          if-no-files-found: warn
          retention-days: 7

      - name: Report
        if: always()
        shell: pwsh
        run: |
          "## Toolchain probes"                     | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ""                                        | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "| Probe | Present | Detail |"             | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "| --- | --- | --- |"                      | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if (Test-Path 'results.txt') {
            foreach ($line in Get-Content 'results.txt' -Encoding utf8) {
              $parts = $line -split '\|', 3
              $detail = if ($parts[2]) { '`' + $parts[2] + '`' } else { '' }
              "| $($parts[0]) | $($parts[1]) | $detail" + ' |' |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
          else {
            "| (probe step did not run) | | |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          $builds = @(
            @{ Name = 'Framework via dotnet build (baseline)'; Result = '${{ steps.build-framework.outcome }}'; Blocking = $false },
            @{ Name = 'VSIX via VS MSBuild';                   Result = '${{ steps.build-vsix.outcome }}';      Blocking = $true },
            @{ Name = 'Legacy examples via VS MSBuild';        Result = '${{ steps.build-examples.outcome }}';  Blocking = $true },
            @{ Name = 'CLI publish (nuspec prerequisite)';     Result = '${{ steps.publish-cli.outcome }}';    Blocking = $true },
            @{ Name = 'nuspec pack via nuget.exe';             Result = '${{ steps.pack-nuspec.outcome }}';     Blocking = $true }
          )

          ""                                        | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "## Build attempts"                       | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ""                                        | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "| Attempt | Outcome | Blocks a migration |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "| --- | --- | --- |"                      | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          $blockers = @()

          foreach ($b in $builds) {
            $blocks = if ($b.Blocking -and $b.Result -ne 'success') { 'yes' } else { 'no' }

            if ($blocks -eq 'yes') {
              $blockers += $b.Name
            }

            "| $($b.Name) | $($b.Result) | $blocks |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

          ""                                        | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "## Verdict"                              | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ""                                        | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($blockers.Count -eq 0) {
            "A GitHub-hosted windows runner can do everything the Azure DevOps agents do for this repository. Nothing blocks a migration on the build side." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          else {
            "These would have to be solved before moving CI, for example with a self-hosted runner or by installing the missing components in the workflow:" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            ""                                      | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

            foreach ($blocker in $blockers) {
              "- $blocker" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }

          ""                                        | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Not covered by this spike: the integration tests, which need a Dataverse connection string and a deployed examples solution." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
