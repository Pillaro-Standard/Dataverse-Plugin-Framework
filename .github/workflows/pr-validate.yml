name: Pull Request – Validate

# Replaces the Azure DevOps "PR – Validate" pipeline, which was removed as the required
# status check on main and develop. Mirrors what it did: restore, build both test
# projects with full MSBuild, and run the tests.
#
# Deliberately runs only the tests that need no Dataverse connection. The rest are
# Dataverse-backed against a shared environment, which makes them flaky by construction:
# two pull requests running at once compete for the same test data, and the concurrency
# test in particular passed one run and failed the next. Those live in nightly-tests.yml.
#
# Both test projects are still built, so a compile break in the examples is caught here.

on:
  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release

jobs:
  validate:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # examples/*.Logic is a legacy non-SDK project, so the examples test project cannot
      # be restored or built by the dotnet CLI. It needs full MSBuild, which is what the
      # Azure DevOps pipeline used through VSBuild.
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # Both projects, as the Azure DevOps pipeline did. Restoring only the framework one
      # left the example test run failing to resolve Autofac from its deps.json: MSBuild's
      # own -t:Restore was not enough for `dotnet test --no-restore` to find the packages.
      - name: Restore test projects
        shell: pwsh
        run: |
          # Checked individually: a pwsh block exits with the last command's code, so a
          # failing first restore would otherwise be masked.
          foreach ($project in @('tests/Pillaro.Dataverse.PluginFramework.Tests/Pillaro.Dataverse.PluginFramework.Tests.csproj', 'examples/Pillaro.Dataverse.PluginFramework.Examples.Tests/Pillaro.Dataverse.PluginFramework.Examples.Tests.csproj')) {
            dotnet restore $project

            if ($LASTEXITCODE -ne 0) {
              throw "Restore failed for $project."
            }
          }

      - name: Build the framework test project
        run: >
          msbuild tests/Pillaro.Dataverse.PluginFramework.Tests/Pillaro.Dataverse.PluginFramework.Tests.csproj
          -t:Restore,Build
          -p:Configuration=${{ env.CONFIGURATION }}
          -m
          -v:minimal

      - name: Build the example test project
        run: >
          msbuild examples/Pillaro.Dataverse.PluginFramework.Examples.Tests/Pillaro.Dataverse.PluginFramework.Examples.Tests.csproj
          -t:Restore,Build
          -p:Configuration=${{ env.CONFIGURATION }}
          -m
          -v:minimal

      # GetAutoNumberActionTests and DataServiceQueryIntegrationTests derive from
      # TestBase and talk to Dataverse. Both carry Category traits, so they can be
      # excluded by category. A new Dataverse-backed test needs a Category trait as well,
      # or it will fail this job.
      - name: Run tests that need no Dataverse connection
        run: >
          dotnet test tests/Pillaro.Dataverse.PluginFramework.Tests/Pillaro.Dataverse.PluginFramework.Tests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --no-restore
          --filter "Category!=DataService&Category!=DataService.Query&Category!=Autonumbering.GetAutoNumber"
          --logger trx
          --results-directory ${{ runner.temp }}/TestResults
          --collect "XPlat Code Coverage"

      - name: Note what this job does not cover
        if: always()
        shell: pwsh
        run: |
          "> The Dataverse-backed tests are not part of this gate: the DataService and Autonumbering categories in the framework project, and the whole example test project." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ""  | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "> They run in the nightly workflow, where a flaky shared environment blocks nobody." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/TestResults/**/*.trx
            ${{ runner.temp }}/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize test results
        if: always()
        shell: pwsh
        run: |
          $results = @(Get-ChildItem -Path "$env:RUNNER_TEMP/TestResults" -Recurse -Filter '*.trx' -ErrorAction SilentlyContinue)

          if ($results.Count -eq 0) {
            "No test result files were produced." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            return
          }

          "## Tests"                          | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ""                                  | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "| Run | Total | Passed | Failed | Skipped |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "| --- | --- | --- | --- | --- |"    | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          foreach ($file in $results) {
            try {
              [xml]$trx = Get-Content -LiteralPath $file.FullName -Raw
              $c = $trx.TestRun.ResultSummary.Counters
              "| $($file.BaseName) | $($c.total) | $($c.passed) | $($c.failed) | $([int]$c.total - [int]$c.passed - [int]$c.failed) |" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
            catch {
              "| $($file.BaseName) | could not be parsed | | | |" |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
